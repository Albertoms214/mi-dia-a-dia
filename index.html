  <p class="empty" style="padding:8px 0">Guarda en un archivo todos tus datos (gastos, presupuestos conjuntos, gastos anuales, tareas, regalos, medidas, billetes, documentos y despensa, con sus fotos) o recupéralos desde una copia.</p>
  <div style="display:flex;flex-direction:column;gap:10px">
    <button class="btn white full" data-act="exportData" ${dl?'':'disabled'}>${ic('pdf')} Exportar copia</button>
    <label class="btn full photo-btn">${ic('undo')} Importar una copia<input type="file" accept="application/json,.json" data-import="1"></label>
  </div>
  <p class="note" style="text-align:left;margin-top:12px">Las copias de las apps de prueba de Billetes, Documentos y Despensa también se cargan aquí: se añaden a lo que ya tienes.</p>
  ${imp?`<div class="panel" style="margin-top:14px;padding:14px;border-color:var(--neg)"><p style="margin:0 0 10px;font-weight:600">La copia es del ${esc(new Date(imp.exportado||Date.now()).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}))}: ${esc(impSummary(imp))}.</p>
    <p class="note" style="text-align:left;margin:0 0 10px">Sustituye lo que tienes ahora en ${S.mode==='db'?'tu cuenta':'este móvil'}.</p>
    <div style="display:flex;gap:8px"><button class="btn danger" style="flex:1" data-act="importOk">Sustituir mis datos</button><button class="btn" style="flex:1" data-act="importNo">Cancelar</button></div></div>`:''}
  <p class="err" id="shErr"></p>`;
  openSheet();
}
async function exportData(){
  if(!dl){toast('Las descargas no están disponibles aquí.');return}
  const data=JSON.parse(JSON.stringify({app:'mi-dia-a-dia',version:1,exportado:Date.now(),months:S.months,cats:S.cats,anuales:S.anuales,conjuntos:D.cj,tareas:TK.list,regalos:GK.people.filter(p=>!p.yo||p.regalos.length),medidas:HK.items}));
  toast('Preparando la copia…');
  data.version=2;data.billetes=BI.tickets.map(t=>({...t}));data.documentos=await oExport();data.despensa=JSON.parse(JSON.stringify(dExport()));
  const withPhoto=[];for(const p of data.regalos)for(const g of p.regalos||[])if(g.foto)withPhoto.push(g);for(const it of data.medidas)if(it.foto)withPhoto.push(it);
  let fail=0;if(withPhoto.length)toast('Preparando '+withPhoto.length+' foto'+(withPhoto.length===1?'':'s')+'…');
  for(const o of withPhoto){try{const r=await fetch('/_blob/'+o.foto);if(!r.ok)throw 0;o.fotoData=await blobToDataURL(await r.blob());delete o.foto}catch(e){fail++;delete o.foto}}
  try{await dl.save({filename:'mi-dia-a-dia-copia-'+todayISO()+'.json',data:JSON.stringify(data)});toast(fail?`Copia guardada (${fail} foto${fail===1?'':'s'} no se pudo incluir)`:'Copia guardada')}
  catch(e){const c=e&&e.code;if(c!=='declined')toast('No se ha podido guardar la copia'+(c?' ('+c+')':'')+'.')}
}
function readImport(input){const f=input.files&&input.files[0];input.value='';if(!f)return;
  const r=new FileReader();r.onload=()=>{let d=null;try{d=JSON.parse(r.result)}catch(e){}importAny(d)};r.readAsText(f)}
function impSummary(d){const n=(k,a,b)=>`${k} ${k===1?a:b}`;const L=[n(Object.keys(d.months||{}).length,'mes','meses'),n((d.tareas||[]).length,'tarea','tareas'),n((d.regalos||[]).length,'persona','personas'),n((d.medidas||[]).length,'medida','medidas')];
  if(Array.isArray(d.billetes))L.push(n(d.billetes.length,'billete','billetes'));if(Array.isArray(d.documentos))L.push(n(d.documentos.length,'documento','documentos'));
  if(d.despensa&&Array.isArray(d.despensa.products))L.push(n(d.despensa.products.length,'producto','productos')+' de la despensa');
  return L.slice(0,-1).join(', ')+' y '+L[L.length-1]}
async function importAny(d){
  if(d&&d.app==='mi-dia-a-dia'){S.pendingImport=d;openBackup();return}
  if(d&&(d.app==='mis-billetes'||(!d.app&&Array.isArray(d.billetes)))){toast('Cargando los billetes…');const n=await bImport(d.billetes,false);closeSheet();render();toast(n?`${n} ${plural(n,'billete añadido','billetes añadidos')}`:'Esa copia no tiene billetes.');return}
  if(d&&(d.app==='mis-documentos'||(!d.app&&Array.isArray(d.documentos)))){toast('Cargando los documentos…');const n=await oImport(d.documentos,false);closeSheet();render();toast(n?`${n} ${plural(n,'documento añadido','documentos añadidos')}`:'Esa copia no tiene documentos.');return}
  if(d&&d.app==='despensa'){const n=dMerge(d);closeSheet();render();toast(n?`${n} ${plural(n,'producto añadido','productos añadidos')} a la despensa`:'No había productos nuevos en esa copia.');return}
  toast('Ese archivo no es una copia de Mi día a día.');
}
async function applyImport(){
  const d=S.pendingImport;if(!d)return;S.pendingImport=null;
  S.months=d.months||{};if(Array.isArray(d.cats)&&d.cats.length)S.cats=fixCats(d.cats);S.anuales=Array.isArray(d.anuales)?d.anuales:[];
  if(d.conjuntos&&typeof d.conjuntos==='object'){const c=d.conjuntos;D.cj={months:c.months||{},cats:Array.isArray(c.cats)&&c.cats.length?fixCats(c.cats):CATS_DEFAULT.map(x=>({...x})),anuales:Array.isArray(c.anuales)?c.anuales:[]}}
  TK.list=Array.isArray(d.tareas)?d.tareas:[];GK.people=Array.isArray(d.regalos)?d.regalos:[];ensureYo();HK.items=Array.isArray(d.medidas)?d.medidas:[];
  if(S.mode==='db'){for(const ym in S.months)saveMonth(ym);saveCats();saveAnuales();if(d.conjuntos){S.ctx='cj';for(const ym in S.months)saveMonth(ym);saveCats();saveAnuales();S.ctx='main'}for(const t of TK.list)saveTask(t);for(const p of GK.people)if(!p.yo||p.regalos.length)savePerson(p);for(const it of HK.items)saveHouse(it)}
  else{saveLocal();saveTasksLocal();saveGiftsLocal();saveHouseLocal()}
  if(Array.isArray(d.billetes)||Array.isArray(d.documentos)||d.despensa)toast('Recuperando…');
  if(Array.isArray(d.billetes))await bImport(d.billetes,true);
  if(Array.isArray(d.documentos))await oImport(d.documentos,true);
  if(d.despensa&&typeof d.despensa==='object')dImport(d.despensa);
  closeSheet();render();toast('Datos recuperados');
}

  switch(a){
    case 'tab':S.tab=b.dataset.tab;if(S.tab==='historial')S.year=+S.ym.slice(0,4);render();window.scrollTo(0,0);break;
    case 'goCats':S.tab='categorias';render();window.scrollTo(0,0);break;
    case 'catDetail':S.tab='categorias';S.open={[id]:true};render();window.scrollTo(0,0);break;
    case 'prevM':S.ym=ymAdd(S.ym,-1);S.open={};render();break;
    case 'nextM':S.ym=ymAdd(S.ym,1);S.open={};render();break;
    case 'thisM':S.ym=CUR;render();break;
    case 'prevY':S.year--;render();break;
    case 'nextY':S.year++;render();break;
    case 'thisY':S.year=+CUR.slice(0,4);render();break;
    case 'goMonth':S.ym=b.dataset.ym;S.tab='inicio';render();window.scrollTo(0,0);break;
    case 'addGasto':openGasto(S.ym,null);break;
    case 'addIngreso':openIngreso(null);break;
    case 'openIngresos':openIngresos();break;
    case 'editG':openGasto(b.dataset.ym,id);break;
    case 'editI':openIngreso(id);break;
    case 'close':closeSheet();break;
    case 'home':go('hub');break;
    case 'open':if(b.dataset.app==='trabajo'){location.href='trabajo.html';break}go(b.dataset.app);if(S.app==='gastos'){S.tab='inicio';render()}break;
    case 'tView':TK.view=b.dataset.v;TK.open=null;TK.confirm=null;renderTareas();break;
    case 'tAdd':tAdd();break;
    case 'tOpen':TK.open=TK.open===id?null:id;TK.confirm=null;renderTareas();break;
    case 'tDone':tDone(id);break;
    case 'tUndone':tUndone(id);break;
    case 'tDel':tDel(id);break;
    case 'gAddP':gAddP();break;
    case 'gBulk':GK.bulk=!GK.bulk;renderRegalos();break;
    case 'gBulkOk':gBulkOk();break;
    case 'gBulkFill':GK.bulkText=BULK_PRELOAD;renderRegalos();break;
    case 'backup':S.pendingImport=null;openBackup();break;
    case 'exportData':exportData();break;
    case 'importOk':applyImport();break;
    case 'importNo':S.pendingImport=null;openBackup();break;
    case 'aNew':openAnual(null);break;
    case 'aEdit':openAnual(id);break;
    case 'aSave':saveAnual();break;
    case 'aDel':delAnual(b);break;
    case 'aToGasto':anualToGasto();break;
    case 'hNew':openMedida(null);break;
    case 'hEdit':openMedida(id);break;
    case 'hSave':saveMedida();break;
    case 'hDel':delMedida(b);break;
    case 'hLoc':{const i=$('#hLugar');if(i){i.value=b.dataset.v;}break}
    case 'photoView':openPhoto(b.dataset.src);break;
    case 'photoDel':photoRemove(b.dataset.photo);break;
    case 'gToggle':GK.open[id]=!GK.open[id];GK.gopen=null;GK.price=null;GK.confirm=null;renderRegalos();break;
    case 'gAddG':gAddG(b.dataset.p);break;
    case 'gTick':gTick(b.dataset.p,id);break;
    case 'gOpen':GK.gopen=GK.gopen===id?null:id;GK.price=null;GK.confirm=null;renderRegalos();break;
    case 'gPriceSave':gPriceSave();break;
    case 'gPriceSkip':GK.price=null;renderRegalos();break;
    case 'gDel':gDel(b.dataset.p,id);break;
    case 'pDel':pDel(id);break;
    case 'tUndoLast':if(lastDone){const t=TK.list.find(x=>x.id===lastDone);if(t){t.hecha=null;saveTask(t)}lastDone=null;$('#toast').hidden=true;if(S.app==='tareas')renderTareas()}break;
    case 'submitSheet':submitSheet();break;
    case 'submitCat':submitCat();break;
    case 'pickCat':SH.cat=id;SH.manualCat=true;$('#shErr').textContent='';refreshSheet();break;
    case 'key':pressKey(b.dataset.k);break;
    case 'qchip':$('#shConcepto').value=b.dataset.v==='Otro'?'':b.dataset.v;document.querySelectorAll('.qchip').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(b.dataset.v==='Otro')$('#shConcepto').focus();break;
    case 'delItem':delItem(b);break;
    case 'copyIng':{const prev=peek(ymAdd(S.ym,-1));month(S.ym).ing=prev.ing.map(i=>({id:newId(),concepto:i.concepto,importe:i.importe,t:Date.now()}));saveMonth(S.ym);render();toast('Ingresos copiados');break}
    case 'toggleCat':S.open[id]=!S.open[id];render();break;
    case 'catStyle':openCatStyle(id);break;
    case 'catNew':openCatStyle(null);break;
    case 'pickIcon':SH.icon=b.dataset.v;SH.draw();break;
    case 'pickColor':SH.color=b.dataset.v;SH.draw();break;
    case 'catDel':delCat(id);break;
    case 'pdfMes':exportPDF('mes');break;
    case 'pdfAno':exportPDF('ano');break;
  }
});
document.addEventListener('submit',e=>{const f=e.target.dataset.form;if(!f)return;e.preventDefault();if(f==='sheet')submitSheet();else if(f==='cat')submitCat()});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.cat)renameCat(e.target.dataset.cat,e.target.value)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&(LY.kind||!$('#sheet').hidden)){appBack();return}
  if(e.key==='Enter'&&e.target.matches('tr[data-act]')){e.target.click();return}
  if(e.key==='Enter'&&e.target.matches('#tNew')){e.preventDefault();tAdd();return}
  if(e.key==='Enter'&&e.target.matches('#gNewP')){e.preventDefault();gAddP();return}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.gnew){e.preventDefault();gAddG(e.target.dataset.gnew);return}
  if(e.key==='Enter'&&e.target.matches('#gPrice')){e.preventDefault();gPriceSave();return}
  if(e.key==='Enter'&&e.target.dataset&&(e.target.dataset.gedit||e.target.dataset.gprice||e.target.dataset.pname)){e.preventDefault();e.target.blur();return}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.tedit){e.preventDefault();e.target.blur();return}
  if(e.key==='Enter'&&SH&&e.target.matches('#shConcepto')){e.preventDefault();submitSheet();return}
  if(e.key==='Enter'&&SH&&SH.kind==='cat'&&e.target.matches('#catName')){e.preventDefault();submitCat();return}
  if(SH&&(SH.kind==='gasto'||SH.kind==='ingreso')&&!e.target.matches('input')){
    if(/^[0-9]$/.test(e.key)){pressKey(e.key);e.preventDefault()}
    else if(e.key===','||e.key==='.'){pressKey(',');e.preventDefault()}
    else if(e.key==='Backspace'){pressKey('back');e.preventDefault()}
    else if(e.key==='Enter'){submitSheet();e.preventDefault()}
  }
});

/* ---------- arranque ---------- */
async function init(){
  render();
  await kvInit();
  await fdbInit();await Promise.all([bLoad(),oLoad()]);dLoad();try{bInitLists()}catch(e){}backInit();
  const C=window.claude;let user=null,db=null;
  if(!(C&&C.use)){
    dl={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith('.json')?'application/json':'application/octet-stream'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return{status:'saved'}}};
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  }
  if(C&&C.use){const u=n=>C.use(n).catch(()=>null);[user,db,dl,AS]=await Promise.all([u('user'),u('db'),u('downloads'),u('assets')])}
  let uidv=null;if(user){try{uidv=await user.id()}catch(e){}}
  if(db&&uidv){
    col=db.collection('data/users/'+uidv);S.mode='db';
    col.onSnapshot(snap=>{applySnap(snap);applyTasks(snap);applyGifts(snap);applyHouse(snap);S.ready=true;render()},
      err=>{toast('No se pueden cargar tus datos ('+((err&&err.code)||'error')+').');if(!S.ready){S.mode='local';loadLocal();loadTasksLocal();loadGiftsLocal();loadHouseLocal();S.ready=true;render()}});
  }else{S.mode='local';loadLocal();loadTasksLocal();loadGiftsLocal();loadHouseLocal();S.ready=true;render()}
}
window.addEventListener('error',e=>{try{toast('Algo ha fallado: '+(e.message||'error desconocido'))}catch(_){}});
init();
})();
