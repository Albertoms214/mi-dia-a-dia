<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi día a día</title>
<meta name="theme-color" content="#0A0E11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: app de banco oscura de una columna; tarjeta verde de saldo arriba, movimientos debajo, barra inferior con botón + central y hoja de apunte con iconos y teclado. */
:root{
  --bg:#0A0E11; --s1:#12181C; --s2:#1A2228; --s3:#243038; --line:#222C33;
  --fg:#ECF1F4; --muted:#8C99A4; --dim:#5E6B75;
  --mint:#7FE0C2; --mint-ink:#052A1F; --card:#185A4B; --card-hi:#23806A; --card-over:#5C2620; --card-over-hi:#8A3A30;
  --neg:#FF8A7A; --pos:#7FE0C2;
  --f:"Manrope","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 130px;font-variant-numeric:tabular-nums}
body.no-tabbar{padding-block:0 48px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;display:block}
.wrap{max-width:520px;margin-inline:auto;display:flex;flex-direction:column;gap:18px;min-width:0;width:100%}
.wrap>*,.sec>*{min-width:0;max-width:100%}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 6px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.period{display:flex;align-items:center;gap:2px}
.top .period{flex:1;min-width:0}
.top .back{background:transparent;border-color:transparent;color:var(--fg)}
.period .lbl{font-weight:800;font-size:1.15rem;white-space:nowrap;letter-spacing:-.02em;padding:4px 6px;border-radius:10px}
.round{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--s1);color:var(--muted);border:1px solid var(--line)}
.round:hover{color:var(--fg);background:var(--s2)}
.round[disabled]{opacity:.4;cursor:not-allowed}

/* Tarjeta de saldo */
.bal{position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 18px;background:radial-gradient(120% 90% at 100% 0%,var(--card-hi),var(--card) 60%);display:flex;flex-direction:column;gap:14px}
.bal.over{background:radial-gradient(120% 90% at 100% 0%,var(--card-over-hi),var(--card-over) 60%)}
.bal::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;border:28px solid rgba(255,255,255,.05);pointer-events:none}
.bal .k{font-size:.82rem;font-weight:600;color:rgba(236,241,244,.72)}
.bal .big{font-size:clamp(2.3rem,11vw,3rem);font-weight:800;letter-spacing:-.035em;line-height:1;color:#fff}
.bal .big small{font-size:.5em;font-weight:700;opacity:.8;margin-left:2px}
.bar{height:6px;border-radius:9px;background:rgba(0,0,0,.25);overflow:hidden}
.bar b{display:block;height:100%;border-radius:9px;background:var(--mint);transition:width .5s}
.bal.over .bar b{background:var(--neg)}
.bal .note{font-size:.8rem;color:rgba(236,241,244,.72);margin-top:-6px}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1}
.io button{background:rgba(0,0,0,.2);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.io button:hover{background:rgba(0,0,0,.3)}
.io span{font-size:.74rem;color:rgba(236,241,244,.7);font-weight:600;display:flex;align-items:center;gap:4px}
.io span svg{width:14px;height:14px}
.io b{font-size:1.05rem;font-weight:700;color:#fff}

/* Secciones */
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h2{margin:0;font-size:1.02rem;font-weight:700;letter-spacing:-.01em}
.sec-h .aside{color:var(--muted);font-size:.86rem;font-weight:600}
.link{color:var(--mint);font-weight:700;font-size:.86rem}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.strip::-webkit-scrollbar{display:none}
.ctile{flex:none;width:118px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;text-align:left}
.ctile .nm{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.ctile .v{font-weight:800;font-size:1.02rem}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.ico svg{width:20px;height:20px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.panel .row:first-child,.day+.row{border-top:0}
.row .t{min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted);font-size:.74rem;font-weight:600;letter-spacing:.05em}
.row .amt{font-weight:700}
.row .amt.in{color:var(--pos)}
.row:hover .t b{color:#fff}
.day{display:flex;justify-content:space-between;font-size:.76rem;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;padding:12px 0 2px;border-top:1px solid var(--line)}
.panel .day:first-child{border-top:0;padding-top:8px}
.empty{color:var(--muted);font-size:.92rem;padding:14px 0;line-height:1.5}
.empty b{color:var(--fg)}
.btn{border-radius:14px;padding:12px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--s2);border:1px solid var(--line)}
.btn:hover{background:var(--s3)}
.btn.mint{background:var(--mint);color:var(--mint-ink);border-color:var(--mint)}
.btn.mint:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-style:dashed;color:var(--muted)}
.btn.danger{color:var(--neg);background:transparent;border-color:color-mix(in srgb,var(--neg) 35%,var(--line))}
.btn.danger.armed{background:var(--neg);color:#2A0A05;border-color:var(--neg)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:18px;height:18px}
.full{width:100%}
.note{font-size:.78rem;color:var(--dim);text-align:center}

/* Categorías: rosco y barras */
.donut-box{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.donut{width:150px;height:150px}
.legend{display:flex;flex-direction:column;gap:7px;min-width:0}
.legend div{display:flex;justify-content:space-between;gap:8px;font-size:.84rem}
.legend span{display:flex;gap:7px;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-weight:600}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
@media (max-width:400px){.donut-box{grid-template-columns:1fr;justify-items:center}.legend{width:100%}}
.cbar{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.panel .cbar:first-child{border-top:0}
.cbar .l1{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.cbar .nm{font-weight:700;font-size:.86rem;letter-spacing:.05em}
.cbar .nm small{display:block;color:var(--muted);font-weight:600;letter-spacing:0;font-size:.74rem}
.cbar .v{font-weight:800;text-align:right}
.cbar .v small{display:block;color:var(--muted);font-weight:600;font-size:.74rem}
.track{height:5px;border-radius:9px;background:var(--s3);overflow:hidden;margin-left:52px}
.track b{display:block;height:100%;border-radius:9px}
.sub{margin-left:52px;padding-bottom:6px}
.sub .row{padding:8px 0;font-size:.92rem}

/* Historial */
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line)}
.chart .tx{fill:var(--dim);font-size:9px;font-weight:700;font-family:var(--f)}
.chart .cur{fill:var(--s2)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;text-align:right;padding:10px 6px 6px}
th:first-child,td:first-child{text-align:left}
td{padding:10px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap;font-weight:600}
td:first-child{text-transform:capitalize}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--s2)}
tr.muted td{color:var(--dim);font-weight:500}
tfoot td{font-weight:800;border-top:1px solid var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.leg2{display:flex;gap:14px;font-size:.78rem;color:var(--muted);font-weight:600}
.leg2 i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}

/* Ajustes */
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.panel .mrow:first-child{border-top:0}
.mrow input,.inp{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;width:100%;font-weight:600}
.mrow input{text-transform:uppercase;letter-spacing:.04em}
.mrow input:focus,.inp:focus{border-color:var(--mint);outline:none}
.mini{font-size:.82rem;padding:8px 12px;border-radius:11px}

/* Barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))!important;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar .in{max-width:520px;margin-inline:auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:.68rem;font-weight:700;padding:6px 0;border-radius:12px}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{color:var(--mint)}
.add{justify-self:center;width:60px;height:60px;border-radius:50%;background:var(--mint);color:var(--mint-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:0 0 0 6px var(--bg),0 10px 24px -8px rgba(127,224,194,.55)}
.add svg{width:28px;height:28px;stroke-width:2.6}
.add:active{transform:scale(.95)}

/* Hoja de apunte */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;margin-inline:auto;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 16px calc(44px + env(safe-area-inset-bottom,0px));max-height:94vh;overflow-y:auto;animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--s3);margin:0 auto 10px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh h2{margin:0;font-size:1.05rem;font-weight:700;color:var(--muted)}
.display{text-align:center;padding:10px 0 4px}
.display .amt{font-size:clamp(2.6rem,13vw,3.4rem);font-weight:800;letter-spacing:-.04em;line-height:1.05}
.display .amt.zero{color:var(--dim)}
.display .amt small{font-size:.5em;margin-left:4px;color:var(--muted)}
.display .sel{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-top:4px;min-height:1.4em}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px 8px;border-radius:16px;border:1.5px solid transparent;background:var(--s2)}
.cat .ico{width:38px;height:38px;border-radius:12px}
.cat span{font-size:.64rem;font-weight:800;letter-spacing:.05em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:2px;color:var(--muted)}
.cat[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--s2))}
.cat[aria-pressed="true"] span{color:var(--fg)}
.meta{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
.meta input[type=date]{width:auto;max-width:150px}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.qchip{padding:7px 12px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-size:.82rem;font-weight:700;color:var(--muted)}
.qchip[aria-pressed="true"]{border-color:var(--mint);color:var(--fg);background:color-mix(in srgb,var(--mint) 14%,var(--s2))}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.key.ok{grid-column:4;grid-row:1 / span 3;height:auto;background:var(--mint);color:var(--mint-ink);font-size:.95rem;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.key.ok svg{width:28px;height:28px;stroke-width:2.8}
.key.zero{grid-column:span 2}
.key.del{color:var(--muted)}
.key{height:50px;border-radius:15px;background:var(--s2);font-size:1.45rem;font-weight:700;display:grid;place-items:center}
.key:active{background:var(--s3);transform:scale(.97)}
.key svg{width:24px;height:24px}
.err{color:var(--neg);font-size:.84rem;font-weight:600;text-align:center;margin:8px 0 0;min-height:1.2em}
.sacts{display:flex;gap:8px;margin-top:10px}
.sacts .mint{flex:1;padding:15px;font-size:1rem}
.icgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.icgrid button{aspect-ratio:1;border-radius:12px;background:var(--s2);display:grid;place-items:center;border:1.5px solid transparent;max-width:100%}
.icgrid button[aria-pressed="true"]{border-color:var(--mint)}
.colors{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid var(--s1);box-shadow:0 0 0 1.5px transparent}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.lab{font-size:.74rem;font-weight:700;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;margin-top:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:.9rem;font-weight:700;max-width:calc(100% - 32px);text-align:center}

/* Inicio: iconos tipo móvil */
.screen{animation:screenIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hub{padding-top:34px;display:flex;flex-direction:column;gap:6px}
.hub .date{color:var(--muted);font-weight:600;font-size:.9rem}
.hub h1{margin:0;font-size:2.2rem;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.hub .greet{color:var(--dim);font-weight:600;font-size:.92rem}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 12px;margin-top:34px;justify-items:center}
.appbtn{display:flex;flex-direction:column;align-items:center;gap:9px;width:100%;max-width:110px;position:relative}
.appbtn .tile{width:76px;height:76px;border-radius:24px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;color:var(--fg);transition:transform .15s,background .15s}
.appbtn .tile svg{width:32px;height:32px;stroke-width:1.7}
.appbtn:hover .tile{background:var(--s2)}
.appbtn:active .tile{transform:scale(.94)}
.appbtn .nm{font-size:.8rem;font-weight:700;text-align:center;line-height:1.25}
.appbtn .badge{position:absolute;top:-6px;left:calc(50% + 24px);min-width:24px;height:24px;padding:0 7px;border-radius:99px;background:var(--fg);color:var(--bg);font-size:.76rem;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.appbtn.soon{opacity:.35;cursor:default}
.appbtn.soon .tile{background:transparent;border-style:dashed}
.hubnote{margin-top:40px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:16px}
.hubnote div{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;color:var(--muted);font-weight:600;padding:6px 0}
.hubnote b{color:var(--fg);font-weight:700}

/* Tareas: lista con círculos, blanco y negro */
.ttitle{font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:9px;border-radius:10px;font-weight:700;color:var(--muted);font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.addbar{display:flex;gap:8px}
.addbar .inp{flex:1;padding:13px 14px;font-size:1rem;font-weight:500}
.addbar .inp:focus{border-color:var(--fg)}
.addbtn{width:50px;height:50px;border-radius:15px;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.addbtn svg{width:24px;height:24px;stroke-width:2.6}
.tlist{display:flex;flex-direction:column}
.task{border-top:1px solid var(--line)}
.tlist .task:first-child,.tday+.task{border-top:0}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:13px 0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--dim);display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s}
.chk:hover{border-color:var(--fg)}
.chk svg{width:15px;height:15px;stroke-width:3.2;opacity:0;transition:opacity .2s}
.chk.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chk.on svg{opacity:1}
.ttext{text-align:left;min-width:0;display:flex;flex-direction:column;gap:1px}
.ttext b{font-weight:600;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttext small{color:var(--dim);font-size:.78rem;font-weight:600;display:flex;gap:6px;align-items:center}
.ttext small svg{width:13px;height:13px}
.task.done .ttext b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--dim)}
.tage{color:var(--dim);font-size:.8rem;font-weight:700;white-space:nowrap}
.task.open{background:var(--s1);border:1px solid var(--line);border-radius:18px;margin:6px -10px;padding:0 10px}
.task.open+.task{border-top:0}
.task.leaving{opacity:.35;transition:opacity .35s}
.tdet{display:flex;flex-direction:column;gap:12px;padding:0 0 14px 38px}
.since{display:flex;flex-direction:column;gap:2px}
.since .lb{font-size:.7rem;font-weight:800;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.since .big{font-size:1.7rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.86rem}
.facts dt{color:var(--dim);font-weight:700}
.facts dd{margin:0;font-weight:600}
body.no-tabbar .toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.tdet .inp{font-weight:600}
.tdet textarea.inp{min-height:84px;resize:vertical;font-weight:500;line-height:1.45;font-family:var(--f)}
.tdet .inp:focus{border-color:var(--fg)}
.tdet .saved{font-size:.74rem;color:var(--dim);font-weight:600;min-height:1em;margin-top:-6px}
.tacts{display:flex;gap:8px;flex-wrap:wrap}
.tday{font-size:.72rem;font-weight:800;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;padding:16px 0 4px;display:flex;justify-content:space-between}
.tlist .tday:first-child{padding-top:4px}
.tempty{color:var(--muted);text-align:center;padding:40px 10px;line-height:1.55}
.tempty svg{width:34px;height:34px;color:var(--dim);margin:0 auto 10px;stroke-width:1.5}

/* Cosas que regalar */
.gsum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gsum div{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
.gsum span{font-size:.68rem;font-weight:800;letter-spacing:.09em;color:var(--dim);text-transform:uppercase}
.gsum b{display:block;font-size:1.35rem;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.plist{display:flex;flex-direction:column;gap:10px}
.pcard{background:var(--s1);border:1px solid var(--line);border-radius:18px;min-width:0}
.pcard.open{border-color:var(--s3)}
.phead{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;width:100%;text-align:left}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:800;font-size:1.05rem;flex:none;text-transform:uppercase}
.avatar svg{width:20px;height:20px}
.pcard.me .avatar{background:var(--fg);color:var(--bg)}
.ptot{display:flex;align-items:center;gap:6px;font-weight:800;white-space:nowrap}
.ptot svg{width:18px;height:18px;color:var(--dim);transition:transform .2s}
.pcard.open .ptot svg{transform:rotate(180deg)}
.pbody{padding:4px 14px 14px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.pcard .task.open{background:var(--s2);border-color:var(--s3)}
.gprice{font-weight:800;white-space:nowrap;font-size:.92rem}
.gprice.none{color:var(--dim);font-weight:600;font-size:.8rem}
.pricebox{display:flex;flex-direction:column;gap:8px;padding:0 0 12px 38px}
.pricebox label{font-size:.8rem;font-weight:700;color:var(--muted)}
.pricebox .row2{display:flex;gap:8px;flex-wrap:wrap}
.pricebox .inp{flex:1;min-width:110px;font-size:1.1rem;font-weight:700}
.pricebox .inp:focus,.pfoot .inp:focus,.addbar .inp:focus{border-color:var(--fg)}
.pfoot{display:flex;gap:8px;padding-top:10px;border-top:1px dashed var(--line);align-items:center}
.pfoot .inp{flex:1;min-width:0}
.addbar.small .inp{padding:10px 12px;font-size:.95rem}
.addbar.small .addbtn{width:44px;height:44px;border-radius:13px}
.btn.white{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pempty{color:var(--dim);font-size:.88rem;padding:10px 0 2px}
.sh .acts{display:flex;gap:8px;align-items:center}
.sh .acts .btn{padding:9px 14px;border-radius:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field>span{font-size:.72rem;font-weight:800;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.field .inp{font-size:1rem}
.field textarea.inp{min-height:76px;resize:vertical;font-family:var(--f);font-weight:500}
.sheet .cats.small .cat{padding:8px 2px 6px}
.sheet .cats.small .cat .ico{width:32px;height:32px;border-radius:10px}
.sheet .cats.small .cat .ico svg{width:17px;height:17px}
/* Gastos anuales */
.ann-sum{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.ann-sum .k{font-size:.78rem;font-weight:700;color:var(--muted)}
.ann-sum .big{font-size:2.2rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.ann-sum .row3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ann-sum .row3 div{background:var(--s2);border-radius:14px;padding:10px 12px;min-width:0}
.ann-sum .row3 span{font-size:.72rem;font-weight:700;color:var(--muted);display:block}
.ann-sum .row3 b{font-weight:800;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtile{width:46px;height:50px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.05}
.dtile b{font-size:1.15rem;font-weight:800}
.dtile span{font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.soon-tag{font-weight:700}
.soon-tag.hot{color:var(--neg)}
.charge{display:flex;gap:10px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px;width:100%;text-align:left}
/* Fotos */
.thumb{width:40px;height:40px;border-radius:11px;object-fit:cover;flex:none;background:var(--s3);display:block}
.photo-big{width:100%;max-height:260px;object-fit:cover;border-radius:16px;display:block;background:var(--s2)}
.photo-add{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--s3);border-radius:16px;padding:16px;color:var(--muted);font-weight:700;cursor:pointer;text-align:center}
.photo-add:hover{border-color:var(--muted);color:var(--fg)}
.photo-add svg{width:20px;height:20px}
.photo-add input,.photo-btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo-btn{position:relative;cursor:pointer}
.photo-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.trow.has-thumb{grid-template-columns:auto 1fr auto auto}
.viewer{display:flex;flex-direction:column;gap:12px}
.viewer img{width:100%;border-radius:16px;max-height:70vh;object-fit:contain;background:#000}
/* Medidas casa */
.mlist{display:flex;flex-direction:column;gap:8px}
.mcard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:10px;width:100%;text-align:left}
.mcard:hover{background:var(--s2)}
.mph{width:64px;height:64px;border-radius:14px;object-fit:cover;background:var(--s2);display:grid;place-items:center;color:var(--dim);flex:none}
.mph svg{width:26px;height:26px;stroke-width:1.6}
.mcard .t{min-width:0;display:flex;flex-direction:column;gap:4px}
.mcard .t b{font-weight:700;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dims{display:flex;gap:6px;flex-wrap:wrap}
.dim{font-size:.76rem;font-weight:700;background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:3px 7px;white-space:nowrap}
.dim i{font-style:normal;color:var(--dim);margin-right:3px}
.mcard .t small{color:var(--dim);font-weight:600;font-size:.76rem}
.grp{font-size:.72rem;font-weight:800;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;padding:10px 2px 0}
.dimin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dimin label{display:flex;flex-direction:column;gap:5px;font-size:.72rem;font-weight:800;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;min-width:0}
.dimin .inp{font-size:1.15rem;font-weight:800;text-align:center;padding:12px 6px}
.boxprev{display:flex;justify-content:center;margin-top:12px}
.boxprev svg{width:100%;max-width:260px;height:auto}
.qloc{display:flex;gap:6px;flex-wrap:wrap}
.qloc button{padding:5px 10px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-size:.78rem;font-weight:700;color:var(--muted)}

.toast button{margin-left:12px;font-weight:800;text-decoration:underline;color:inherit}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- almacenamiento en el dispositivo (IndexedDB, con localStorage de reserva) ---------- */
const KV={m:{},db:null};
function kvGet(k){return Object.prototype.hasOwnProperty.call(KV.m,k)?KV.m[k]:null}
function kvSet(k,v){KV.m[k]=v;
  if(KV.db){try{const tx=KV.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.onerror=()=>toast('No se ha podido guardar en el móvil.')}catch(e){toast('No se ha podido guardar en el móvil.')}}
  else{try{localStorage.setItem(k,v)}catch(e){toast('No se ha podido guardar en este navegador.')}}}
function kvInit(){return new Promise(res=>{
  const fromLS=()=>{try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);KV.m[k]=localStorage.getItem(k)}}catch(e){}};
  let r;try{r=indexedDB.open('mi-dia-a-dia',1)}catch(e){fromLS();return res()}
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onerror=()=>{fromLS();res()};
  r.onsuccess=()=>{KV.db=r.result;try{const st=KV.db.transaction('kv').objectStore('kv'),q=st.openCursor();
    q.onsuccess=()=>{const c=q.result;if(c){KV.m[c.key]=c.value;c.continue()}else{
      try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!(k in KV.m)){KV.m[k]=localStorage.getItem(k);kvSet(k,KV.m[k])}}}catch(e){}
      res()}};q.onerror=()=>{fromLS();res()}}catch(e){fromLS();res()}};
  setTimeout(res,3000);
})}

const month=ym=>S.months[ym]||(S.months[ym]={ing:[],gas:[]});

function fixCats(cats){return cats.map(c=>({...c,color:OLD2NEW[c.color]||c.color,icon:c.icon||DEF_ICON[c.id]||'more'}))}

const LS='libreta-gastos-v1';
function loadLocal(){try{const d=JSON.parse(kvGet(LS)||'null');if(d){S.months=d.months||{};if(Array.isArray(d.anuales))S.anuales=d.anuales;if(d.cats&&d.cats.length)S.cats=fixCats(d.cats)}}catch(e){}}
function saveLocal(){try{kvSet(LS,JSON.stringify({months:S.months,cats:S.cats,anuales:S.anuales}))}catch(e){toast('No se ha podido guardar en este navegador.')}}
const pend={},busy={};
function writeDoc(key,data){
  if(S.mode!=='db'){if(key.startsWith('t-'))saveTasksLocal();else if(key.startsWith('g-'))saveGiftsLocal();else if(key.startsWith('h-'))saveHouseLocal();else saveLocal();return}
  pend[key]=data; if(busy[key])return; busy[key]=true;
  (async()=>{while(pend[key]){const d=pend[key];pend[key]=null;
    try{if(d.__del)await col.doc(key).delete();else await col.doc(key).set(d)}catch(e){toast('No se ha guardado el cambio ('+((e&&e.code)||'error')+'). Repítelo con conexión.')}}
    busy[key]=false})();
}
function saveMonth(ym){const m=peek(ym);writeDoc('m-'+ym,{ym,ing:m.ing,gas:m.gas,t:Date.now()})}
function saveCats(){writeDoc('ajustes',{cats:S.cats,t:Date.now()})}
function saveAnuales(){writeDoc('anuales',{items:S.anuales,t:Date.now()})}
function applySnap(snap){
  const months={};let cats=null;
  for(const d of snap.docs){const v=plain(d);
    if(d.id==='ajustes'){if(!busy.ajustes&&Array.isArray(v.cats)&&v.cats.length)cats=v.cats}
    else if(d.id==='anuales'){if(!busy.anuales&&Array.isArray(v.items))S.anuales=v.items}
    else if(d.id.startsWith('m-')){const ym=d.id.slice(2);months[ym]=busy[d.id]?peek(ym):{ing:Array.isArray(v.ing)?v.ing:[],gas:Array.isArray(v.gas)?v.gas:[]}}}
  for(const k in busy){if(busy[k]&&k.startsWith('m-'))months[k.slice(2)]=peek(k.slice(2))}
  S.months=months; if(cats)S.cats=fixCats(cats);
}

function plain(d){try{return JSON.parse(JSON.stringify(d.data()||{}))}catch(e){return {}}}
/* ---------- categoría sugerida ---------- */
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function suggestCat(concepto){
  const c=norm(concepto); if(!c)return null;
  let best=null,bt=0;
  for(const ym in S.months)for(const g of S.months[ym].gas){if(norm(g.concepto)===c&&(g.t||0)>=bt&&S.cats.some(x=>x.id===g.cat)){best=g.cat;bt=g.t||0}}
  if(best)return best;
  const words=c.split(/[^a-z0-9ñ]+/).filter(Boolean);
  for(const id in KEYWORDS){if(!S.cats.some(x=>x.id===id))continue;
    for(const k of KEYWORDS[id]){if(words.some(w=>w===k||(k.length>3&&w.startsWith(k))))return id}}
  for(const x of S.cats){if(words.includes(norm(x.nombre)))return x.id}
  return null;
}

  const top=$('#top');

  const pdfBtn=`<button class="round" data-act="${S.tab==='historial'?'pdfAno':'pdfMes'}" aria-label="Descargar PDF" title="Descargar PDF" ${dl?'':'disabled'}>${ic('pdf')}</button><button class="round" data-act="tab" data-tab="ajustes" aria-label="Ajustes">${ic('settings')}</button>`;
  if(S.tab==='ajustes')top.innerHTML=backBtn+`<div class="period"><span class="lbl">Ajustes</span></div>`;
  else if(S.tab==='anuales')top.innerHTML=backBtn+`<div class="period"><span class="lbl">Gastos anuales</span></div>`;
  else if(S.tab==='historial')top.innerHTML=backBtn+`<div class="period"><button class="round" data-act="prevY" aria-label="Año anterior">${ic('left')}</button><button class="lbl" data-act="thisY">${S.year}</button><button class="round" data-act="nextY" aria-label="Año siguiente">${ic('right')}</button></div>${pdfBtn}`;
  else top.innerHTML=backBtn+`<div class="period"><button class="round" data-act="prevM" aria-label="Mes anterior">${ic('left')}</button><button class="lbl" data-act="thisM" title="Ir al mes actual">${ymLabel(S.ym)}</button><button class="round" data-act="nextM" aria-label="Mes siguiente">${ic('right')}</button></div>${pdfBtn}`;
  const T=(id,icon,l)=>`<button class="tab" data-act="tab" data-tab="${id}" ${S.tab===id?'aria-current="page"':''}>${ic(icon)}${l}</button>`;
  $('#tabbar').innerHTML=T('inicio','home2','Inicio')+T('categorias','grid','Categorías')+`<button class="add" data-act="addGasto" aria-label="Apuntar gasto">${ic('plus')}</button>`+T('anuales','calclock','Anuales')+T('historial','chart','Historial');
  const v=$('#view');
  if(!S.ready){v.innerHTML='<div class="loading">Abriendo tu libreta…</div>';return}
  v.innerHTML=S.tab==='inicio'?viewInicio():S.tab==='categorias'?viewCats():S.tab==='historial'?viewHist():S.tab==='anuales'?viewAnuales():viewAjustes();
}

function balanceCard(label,ti,tg,ioActs){
  const saldo=r2(ti-tg),pct=ti>0?tg/ti:null,over=saldo<0;
  const [ent,dec]=eur(Math.abs(saldo)).replace(/\s?€/,'').split(',');
  let note;
  if(pct===null)note=tg>0?'Sin ingresos apuntados todavía.':'Apunta tus ingresos para ver lo que te queda.';
  else if(over)note=`Te has pasado ${eur(-saldo)}.`;
  else note=`Llevas gastado el ${Math.round(pct*100)} % de lo ingresado.`;
  return `<section class="bal ${over?'over':''}">
    <div><div class="k">${esc(label)}</div><div class="big">${over?'−':''}${ent}<small>,${dec||'00'} €</small></div></div>
    <div class="bar" aria-hidden="true"><b style="width:${pct===null?(tg>0?100:0):Math.min(100,pct*100)}%"></b></div>
    <div class="note">${note}</div>
    <div class="io">
      <button ${ioActs?'data-act="openIngresos"':'tabindex="-1"'}><span>${ic('up')} Ingresos</span><b>${eur(ti)}</b></button>
      <button ${ioActs?'data-act="goCats"':'tabindex="-1"'}><span>${ic('dn')} Gastos</span><b>${eur(tg)}</b></button>
    </div></section>`;
}
function catTotals(gastos){
  const t={};for(const g of gastos){const id=catOf(g.cat).id;t[id]=r2((t[id]||0)+(+g.importe||0))}
  return S.cats.map(c=>({c,v:t[c.id]||0,items:gastos.filter(g=>catOf(g.cat).id===c.id)})).sort((a,b)=>b.v-a.v);
}
function gRow(g,ym,sub){const c=catOf(g.cat);return `<button class="row" data-act="editG" data-ym="${ym}" data-id="${esc(g.id)}"><span class="ico" style="${tint(c.color)}">${ic(c.icon)}</span><span class="t"><b>${esc(g.concepto)}</b><small>${esc(sub||c.nombre)}</small></span><span class="amt">−${eur(g.importe)}</span></button>`}

function viewInicio(){
  const m=peek(S.ym),ti=sum(m.ing),tg=sum(m.gas);
  let h=balanceCard(S.ym===CUR?'Te quedan este mes':'Saldo de '+mName(S.ym),ti,tg,true);
  if(!m.ing.length){
    const p=peek(ymAdd(S.ym,-1));
    h+=`<div class="actions" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn mint" data-act="addIngreso" style="flex:1">${ic('plus')} Añadir ingreso</button>${p.ing.length?`<button class="btn" data-act="copyIng" style="flex:1">Copiar los de ${mName(ymAdd(S.ym,-1))}</button>`:''}</div>`;
  }
  const rows=catTotals(m.gas).filter(r=>r.v>0);
  if(rows.length){
    h+=`<section class="sec"><div class="sec-h"><h2>Por categoría</h2><button class="link" data-act="goCats">Ver todo</button></div><div class="strip">`+
      rows.map(r=>`<button class="ctile" data-act="catDetail" data-id="${esc(r.c.id)}"><span class="ico" style="${tint(r.c.color)}">${ic(r.c.icon)}</span><span><span class="nm">${esc(r.c.nombre)}</span><br><span class="v">${eur(r.v)}</span></span></button>`).join('')+`</div></section>`;
  }
  const ch=chargesIn(S.ym);
  if(ch.length)h+=`<section class="sec"><div class="sec-h"><h2>Cargos anuales este mes</h2><button class="link" data-act="tab" data-tab="anuales">Ver todos</button></div>`+ch.map(a=>annRow(a,a._d)).join('')+`</section>`;
  h+=`<section class="sec"><div class="sec-h"><h2>Movimientos</h2><span class="aside">${m.gas.length} gasto${m.gas.length===1?'':'s'}</span></div>`;
  if(m.gas.length){
    const by={};for(const g of m.gas)(by[g.fecha]=by[g.fecha]||[]).push(g);
    h+='<div class="panel">';
    for(const f of Object.keys(by).sort().reverse()){const arr=by[f].sort((a,b)=>(b.t||0)-(a.t||0));
      h+=`<div class="day"><span>${esc(dayLabel(f))}</span><span>−${eur(sum(arr))}</span></div>`+arr.map(g=>gRow(g,S.ym)).join('')}
    h+='</div>';
  }else h+=`<div class="panel"><p class="empty">Sin gastos en ${mName(S.ym)}. Pulsa el botón <b>+</b> de abajo, elige la categoría y escribe el importe.</p></div>`;
  h+='</section>';
  if(S.mode==='local')h+=`<p class="note">Estos datos se guardan solo en este navegador.</p>`;
  return h;
}

function donut(rows,total,center,sub){
  const R=52,C=2*Math.PI*R;let off=0,segs='';
  if(total>0)for(const r of rows){const len=r.v/total*C,gap=rows.length>1?2:0;segs+=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${esc(r.c.color)}" stroke-width="16" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len}
  return `<svg class="donut" viewBox="0 0 140 140" role="img" aria-label="Reparto de gastos"><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--s3)" stroke-width="16"/>${segs}
  <text x="70" y="64" text-anchor="middle" fill="var(--muted)" font-size="10" font-weight="700" font-family="Manrope,sans-serif">${esc(sub)}</text>
  <text x="70" y="82" text-anchor="middle" fill="var(--fg)" font-size="${center.length>9?13:16}" font-weight="800" font-family="Manrope,sans-serif">${esc(center)}</text></svg>`;
}
function catList(rows,total,ym,expandable){
  return '<div class="panel">'+rows.map(r=>{const open=expandable&&S.open[r.c.id];
    let h=`<button class="cbar" ${expandable?`data-act="toggleCat" data-id="${esc(r.c.id)}" aria-expanded="${!!open}"`:'tabindex="-1"'}>
      <span class="l1"><span class="ico" style="${tint(r.c.color)}">${ic(r.c.icon)}</span><span class="nm">${esc(r.c.nombre)}<small>${r.items.length} gasto${r.items.length===1?'':'s'}</small></span><span class="v">${eur(r.v)}<small>${total?Math.round(r.v/total*100):0} %</small></span></span>
      <span class="track"><b style="width:${total?r.v/total*100:0}%;background:${esc(r.c.color)}"></b></span></button>`;
    if(open)h+='<div class="sub">'+r.items.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(g=>gRow(g,ym,dayLabel(g.fecha))).join('')+'</div>';
    return h}).join('')+'</div>';
}
function viewCats(){
  const m=peek(S.ym),tg=sum(m.gas),rows=catTotals(m.gas).filter(r=>r.v>0);
  if(!rows.length)return `<div class="panel"><p class="empty">En ${mName(S.ym)} todavía no hay gastos. Cuando apuntes, aquí verás cuánto llevas en COMIDA, VIAJES y el resto.</p></div>`;
  let h=`<div class="donut-box">${donut(rows,tg,eur(tg),'GASTADO')}<div class="legend">${rows.slice(0,6).map(r=>`<div><span><i style="background:${esc(r.c.color)}"></i>${esc(r.c.nombre)}</span><b>${tg?Math.round(r.v/tg*100):0} %</b></div>`).join('')}</div></div>`;
  h+=`<section class="sec"><div class="sec-h"><h2>Detalle</h2><span class="aside">Toca para ver los gastos</span></div>${catList(rows,tg,S.ym,true)}</section>`;
  return h;
}

function niceMax(v){if(v<=0)return 100;const p=10**Math.floor(Math.log10(v));for(const k of [1,2,2.5,5,10])if(k*p>=v)return k*p;return 10*p}
const shortEur=v=>v>=1000?(v/1000).toLocaleString('es-ES',{maximumFractionDigits:1})+'k':String(Math.round(v));
function viewHist(){
  const Y=S.year,rows=[];let TI=0,TG=0;const all=[];
  for(let i=1;i<=12;i++){const ym=Y+'-'+pad(i),m=peek(ym),ti=sum(m.ing),tg=sum(m.gas);rows.push({ym,i,ti,tg});TI+=ti;TG+=tg;all.push(...m.gas)}
  TI=r2(TI);TG=r2(TG);
  let h=balanceCard('Balance de '+Y,TI,TG,false);
  const mx=niceMax(Math.max(...rows.map(r=>Math.max(r.ti,r.tg)))),x0=30,x1=356,y0=10,y1=150,gw=(x1-x0)/12,bw=Math.min(9,gw/2-2),y=v=>y1-(v/mx)*(y1-y0);
  let svg=`<svg class="chart" viewBox="0 0 360 170" role="img" aria-label="Ingresos y gastos por mes de ${Y}">`;
  for(const f of [0,.5,1]){const v=mx*f;svg+=`<line class="gl" x1="${x0}" x2="${x1}" y1="${y(v)}" y2="${y(v)}"/><text class="tx" x="${x0-5}" y="${y(v)+3}" text-anchor="end">${shortEur(v)}</text>`}
  rows.forEach((r,k)=>{const cx=x0+gw*k+gw/2;
    if(r.ym===CUR)svg+=`<rect class="cur" x="${x0+gw*k+1}" y="${y0-6}" width="${gw-2}" height="${y1-y0+6}" rx="6"/>`;
    if(r.ti>0)svg+=`<rect fill="var(--pos)" x="${cx-bw-1}" y="${y(r.ti)}" width="${bw}" height="${y1-y(r.ti)}" rx="2.5"/>`;
    if(r.tg>0)svg+=`<rect fill="var(--neg)" x="${cx+1}" y="${y(r.tg)}" width="${bw}" height="${y1-y(r.tg)}" rx="2.5"/>`;
    svg+=`<text class="tx" x="${cx}" y="165" text-anchor="middle">${MESES[k].charAt(0).toUpperCase()}</text>`});
  svg+='</svg>';
  h+=`<section class="sec"><div class="sec-h"><h2>Mes a mes</h2><div class="leg2"><span><i style="background:var(--pos)"></i>Ingresos</span><span><i style="background:var(--neg)"></i>Gastos</span></div></div>
  <div class="panel" style="padding-block:14px">${svg}</div>
  <div class="panel tbl"><table><thead><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Saldo</th></tr></thead><tbody>`+
  rows.map(r=>{const s=r2(r.ti-r.tg),e=!r.ti&&!r.tg;return `<tr class="${e?'muted':''}" data-act="goMonth" data-ym="${r.ym}" tabindex="0"><td>${MESES[r.i-1]}</td><td>${e?'—':eur(r.ti)}</td><td>${e?'—':eur(r.tg)}</td><td class="${e?'':s<0?'neg':'pos'}">${e?'—':eur(s)}</td></tr>`}).join('')+
  `</tbody><tfoot><tr><td>Total</td><td>${eur(TI)}</td><td>${eur(TG)}</td><td class="${TI-TG<0?'neg':'pos'}">${eur(TI-TG)}</td></tr></tfoot></table></div></section>`;
  const crow=catTotals(all).filter(r=>r.v>0);
  h+=`<section class="sec"><div class="sec-h"><h2>Categorías en ${Y}</h2><span class="aside">${eur(TG)}</span></div>${crow.length?catList(crow,TG,null,false):`<div class="panel"><p class="empty">Aún no hay gastos en ${Y}.</p></div>`}</section>`;
  h+=`<button class="btn full" data-act="pdfAno" ${dl?'':'disabled'}>${ic('pdf')} Descargar PDF de ${Y}</button>`;
  return h;
}

function viewAjustes(){
  let h=`<section class="sec"><div class="sec-h"><h2>Tus categorías</h2><span class="aside">Toca el icono para cambiarlo</span></div><div class="panel">`;
  h+=S.cats.map(c=>{const armed=S.confirm==='cat:'+c.id;
    return `<div class="mrow"><button class="ico" style="${tint(c.color)}" data-act="catStyle" data-id="${esc(c.id)}" aria-label="Cambiar icono y color de ${esc(c.nombre)}">${ic(c.icon)}</button>
    <input id="cat-${esc(c.id)}" value="${esc(c.nombre)}" data-cat="${esc(c.id)}" aria-label="Nombre de la categoría" maxlength="20">
    ${c.id==='otros'?'<span style="width:72px"></span>':`<button class="btn danger mini ${armed?'armed':''}" data-act="catDel" data-id="${esc(c.id)}">${armed?'¿Seguro?':'Quitar'}</button>`}</div>`}).join('');
  h+=`</div><button class="btn ghost full" data-act="catNew">${ic('plus')} Nueva categoría</button><p class="note">Si quitas una categoría, sus gastos pasan a OTROS.</p></section>`;
  h+=`<section class="sec"><div class="sec-h"><h2>PDF</h2></div><div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" style="flex:1" data-act="pdfMes" ${dl?'':'disabled'}>${ic('pdf')} ${ymLabel(S.ym)}</button>
    <button class="btn" style="flex:1" data-act="pdfAno" ${dl?'':'disabled'}>${ic('pdf')} Año ${S.year}</button></div></section>`;
  h+=`<p class="note">${S.mode==='db'?'Tus datos se guardan en tu cuenta y solo tú puedes verlos.':'Tus datos se guardan solo en este navegador.'}</p>`;
  return h;
}

let SH=null;
function openSheet(){$('#sheet').hidden=false;$('#scrim').hidden=false;document.body.style.overflow='hidden'}
function closeSheet(){if(SH&&SH.kind==='medida'&&AS&&SH.newPhotos&&SH.newPhotos.length)for(const id of SH.newPhotos)AS.delete(id).catch(()=>{});
  $('#sheet').hidden=true;$('#scrim').hidden=true;$('#sheet').innerHTML='';SH=null;document.body.style.overflow=''}
const fmtEntry=s=>{if(!s)return '0';const [a,b]=s.split(',');return Number(a||0).toLocaleString('es-ES')+(b!==undefined?','+b:'')};
function amtHTML(){const z=!SH.amt||parseAmt(SH.amt)===0;return `<span class="amt ${z?'zero':''}">${fmtEntry(SH.amt)}<small>€</small></span>`}
function selHTML(){if(SH.kind!=='gasto')return '';if(!SH.cat)return 'Elige una categoría';const c=catOf(SH.cat);return `<span style="color:${esc(c.color)}">●</span> ${esc(c.nombre)}`}
function catsHTML(){return S.cats.map(c=>`<button type="button" class="cat" style="--c:${esc(c.color)}" data-act="pickCat" data-id="${esc(c.id)}" aria-pressed="${c.id===SH.cat}"><span class="ico" style="${tint(c.color)}">${ic(c.icon)}</span><span>${esc(c.nombre)}</span></button>`).join('')}
function keysHTML(){const K=k=>`<button type="button" class="key ${k==='0'?'zero':''} ${k==='back'?'del':''}" data-act="key" data-k="${k}" aria-label="${k==='back'?'Borrar':k}">${k==='back'?ic('back'):k}</button>`;
  return ['1','2','3'].map(K).join('')+`<button type="button" class="key ok" id="shSubmit" data-act="submitSheet"></button>`+['4','5','6','7','8','9',',','0','back'].map(K).join('')}
function submitLabel(){const v=parseAmt(SH.amt);const what=SH.kind==='gasto'?(SH.id?'Guardar':'Apuntar'):(SH.id?'Guardar':'Añadir');return v>0?`${what} ${eur(v)}`:(SH.kind==='gasto'?'Apuntar gasto':'Añadir ingreso')}
function refreshSheet(){

</div>`;

function openIngresos(){

function pressKey(k){
  if(!SH)return;let a=SH.amt||'';
  if(k==='back')a=a.slice(0,-1);
  else if(k===','){if(!a.includes(','))a=(a||'0')+','}
  else{const [i,d]=a.split(',');if(d!==undefined){if(d.length>=2)return}else if((i||'').replace(/^0+/,'').length>=6)return;
    a=(a==='0'?'':a)+k}
  SH.amt=a;$('#shErr').textContent='';refreshSheet();
}
function submitSheet(){
  const v=parseAmt(SH.amt),err=$('#shErr');
  if(SH.kind==='gasto'){
    if(!SH.cat){err.textContent='Elige una categoría tocando su icono.';return}
    if(!(v>0)){err.textContent='Escribe el importe con el teclado.';return}
    let fecha=($('#shFecha')&&$('#shFecha').value)||'';if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha))fecha=defaultDate(SH.ym);
    const concepto=$('#shConcepto').value.trim()||cap(catOf(SH.cat).nombre.toLowerCase()),ym=fecha.slice(0,7),cat=SH.cat;
    if(SH.id){const old=month(SH.ym),ix=old.gas.findIndex(x=>x.id===SH.id),g=ix>=0?old.gas[ix]:null;
      if(g){Object.assign(g,{concepto,importe:v,cat,fecha});if(ym!==SH.ym){old.gas.splice(ix,1);month(ym).gas.push(g);saveMonth(SH.ym)}}}
    else month(ym).gas.push({id:newId(),concepto,importe:v,cat,fecha,t:Date.now()});
    saveMonth(ym);const edit=!!SH.id;closeSheet();render();
    toast(ym!==S.ym?`Guardado en ${ymLabel(ym).toLowerCase()}`:edit?'Cambios guardados':`${catOf(cat).nombre} · −${eur(v)}`);
  }else{
    const concepto=$('#shConcepto').value.trim();
    if(!concepto){err.textContent='Escribe o elige de dónde viene el ingreso.';return}
    if(!(v>0)){err.textContent='Escribe el importe con el teclado.';return}

/* ---------- PDF ---------- */
const P=s=>String(s).replace(/[  ]/g,' ');
function hexRgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function pdfFrame(doc,title,sub){
  doc.setFillColor(10,14,17);doc.rect(0,0,210,44,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(127,224,194);doc.text('LIBRETA DE GASTOS',14,15);
  doc.setFontSize(22);doc.setTextColor(255,255,255);doc.text(P(title),14,27);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(140,153,164);doc.text(P(sub),14,35);
}
function pdfSummary(doc,y,ti,tg){
  const boxes=[['INGRESOS',ti,[24,128,90]],['GASTOS',tg,[200,70,55]],['SALDO',r2(ti-tg),ti-tg<0?[200,70,55]:[24,90,75]]];
  boxes.forEach((b,i)=>{const x=14+i*61;doc.setDrawColor(220,226,230);doc.setFillColor(246,248,249);doc.roundedRect(x,y,58,20,2,2,'FD');
    doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(110,120,130);doc.text(b[0],x+4,y+6.5);
    doc.setFontSize(13);doc.setTextColor(...b[2]);doc.text(P(eur(b[1])),x+4,y+15)});
  return y+28;
}
function pdfH(doc,y,t){if(y>262){doc.addPage();y=20}doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(18,24,28);doc.text(P(t),14,y);return y+3}
const TBL={theme:'grid',margin:{left:14,right:14},styles:{font:'helvetica',fontSize:9,cellPadding:2.2,lineColor:[220,226,230],lineWidth:.2,textColor:[18,24,28]},headStyles:{fillColor:[18,24,28],textColor:[255,255,255],fontStyle:'bold'},footStyles:{fillColor:[232,240,237],textColor:[18,24,28],fontStyle:'bold'},alternateRowStyles:{fillColor:[247,249,250]}};
function pdfFooter(doc){const n=doc.getNumberOfPages(),gen='Generado el '+new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(140,150,156);doc.text(P(gen),14,289);doc.text('Página '+i+' de '+n,196,289,{align:'right'})}}
function catTable(doc,y,rows,total,count){
  doc.autoTable({...TBL,startY:y,head:[['Categoría','Nº','%','Importe']],body:rows.length?rows.map(r=>[r.c.nombre,String(r.items.length),(total?Math.round(r.v/total*100):0)+' %',P(eur(r.v))]):[['Sin gastos','','','']],foot:[['Total',String(count),'100 %',P(eur(total))]],
    columnStyles:{1:{halign:'right',cellWidth:16},2:{halign:'right',cellWidth:18},3:{halign:'right',cellWidth:40}},
    didDrawCell:d=>{if(d.section==='body'&&d.column.index===0&&rows[d.row.index]){doc.setFillColor(...hexRgb(rows[d.row.index].c.color));doc.rect(d.cell.x,d.cell.y,1.6,d.cell.height,'F')}}});
}
function buildMonthPDF(ym){
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'}),m=peek(ym),ti=sum(m.ing),tg=sum(m.gas);
  pdfFrame(doc,ymLabel(ym),`${m.ing.length} ingreso${m.ing.length===1?'':'s'} · ${m.gas.length} gasto${m.gas.length===1?'':'s'}`);
  let y=pdfSummary(doc,52,ti,tg);
  y=pdfH(doc,y,'Ingresos');
  doc.autoTable({...TBL,startY:y,head:[['Concepto','Importe']],body:m.ing.length?m.ing.map(i=>[P(i.concepto),P(eur(i.importe))]):[['Sin ingresos','']],foot:[['Total',P(eur(ti))]],columnStyles:{1:{halign:'right',cellWidth:40}}});
  y=pdfH(doc,doc.lastAutoTable.finalY+10,'Gastos por categoría');
  catTable(doc,y,catTotals(m.gas).filter(r=>r.v>0),tg,m.gas.length);
  y=pdfH(doc,doc.lastAutoTable.finalY+10,'Detalle de gastos');
  const det=m.gas.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)||(a.t||0)-(b.t||0));
  doc.autoTable({...TBL,startY:y,head:[['Fecha','Concepto','Categoría','Importe']],body:det.length?det.map(g=>[g.fecha.slice(8)+'/'+g.fecha.slice(5,7),P(g.concepto),catOf(g.cat).nombre,P(eur(g.importe))]):[['','Sin gastos','','']],foot:[['','','Total',P(eur(tg))]],
    columnStyles:{0:{cellWidth:18},2:{cellWidth:36},3:{halign:'right',cellWidth:32}}});
  pdfFooter(doc);return doc;
}
function buildYearPDF(Y){
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});let TI=0,TG=0;const all=[],body=[];
  for(let i=1;i<=12;i++){const m=peek(Y+'-'+pad(i)),ti=sum(m.ing),tg=sum(m.gas);TI+=ti;TG+=tg;all.push(...m.gas);body.push([cap(MESES[i-1]),P(eur(ti)),P(eur(tg)),P(eur(ti-tg))])}
  TI=r2(TI);TG=r2(TG);
  pdfFrame(doc,'Resumen anual '+Y,`${all.length} gastos apuntados`);
  let y=pdfSummary(doc,52,TI,TG);
  y=pdfH(doc,y,'Mes a mes');
  doc.autoTable({...TBL,startY:y,head:[['Mes','Ingresos','Gastos','Saldo']],body,foot:[['Total',P(eur(TI)),P(eur(TG)),P(eur(TI-TG))]],columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'}},
    didParseCell:d=>{if(d.section==='body'&&d.column.index===3&&String(d.cell.raw).includes('-'))d.cell.styles.textColor=[200,70,55]}});
  y=pdfH(doc,doc.lastAutoTable.finalY+10,'Gastos por categoría en '+Y);
  catTable(doc,y,catTotals(all).filter(r=>r.v>0),TG,all.length);
  pdfFooter(doc);return doc;
}
async function exportPDF(kind){
  if(!dl){toast('Las descargas no están disponibles en esta vista.');return}
  if(!window.jspdf||!window.jspdf.jsPDF){toast('El generador de PDF no ha cargado. Recarga la página.');return}
  let doc,name;
  try{if(kind==='mes'){doc=buildMonthPDF(S.ym);name='gastos-'+S.ym+'.pdf'}else{doc=buildYearPDF(S.year);name='gastos-'+S.year+'.pdf'}}
  catch(e){toast('No se ha podido crear el PDF.');return}
  try{await dl.save({filename:name,data:doc.output('blob')});toast('PDF guardado')}
  catch(e){const c=e&&e.code;if(c==='declined')return;if(c==='rate_limited'){toast('Ya hay una descarga pendiente.');return}toast('No se ha podido descargar el PDF ('+(c||'error')+').')}
}

const TK={list:[],view:'pend',open:null,confirm:null,dirty:false};
const LST='mi-dia-tareas-v1';
function loadTasksLocal(){try{const d=JSON.parse(kvGet(LST)||'null');if(Array.isArray(d))TK.list=d}catch(e){}}
function saveTasksLocal(){try{kvSet(LST,JSON.stringify(TK.list))}catch(e){toast('No se ha podido guardar en este navegador.')}}
const delPend=new Set();
function saveTask(t){t.t=Date.now();writeDoc('t-'+t.id,{id:t.id,texto:t.texto,nota:t.nota||'',creada:t.creada,hecha:t.hecha||null,t:t.t})}
function removeTask(id){TK.list=TK.list.filter(x=>x.id!==id);if(S.mode==='db'){delPend.add('t-'+id);writeDoc('t-'+id,{__del:true});setTimeout(()=>delPend.delete('t-'+id),15000)}else saveTasksLocal()}
function applyTasks(snap){
  const keep={};for(const t of TK.list)keep['t-'+t.id]=t;
  const out=[];
  for(const d of snap.docs){if(!d.id.startsWith('t-')||delPend.has(d.id))continue;
    if(busy[d.id]&&keep[d.id]){out.push(keep[d.id]);continue}
    const v=plain(d);if(typeof v.texto!=='string')continue;
    out.push({id:v.id||d.id.slice(2),texto:v.texto,nota:v.nota||'',creada:+v.creada||Date.now(),hecha:v.hecha?+v.hecha:null,t:v.t||0})}
  for(const k in busy){if(busy[k]&&k.startsWith('t-')&&keep[k]&&!out.includes(keep[k])&&!delPend.has(k))out.push(keep[k])}
  TK.list=out;
}
const pendTasks=()=>TK.list.filter(t=>!t.hecha).sort((a,b)=>b.creada-a.creada);
const doneTasks=()=>TK.list.filter(t=>t.hecha).sort((a,b)=>b.hecha-a.hecha);
function fmtWhen(ms){const d=new Date(ms);return cap(d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}))+' · '+pad(d.getHours())+':'+pad(d.getMinutes())}
const hhmm=ms=>{const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())};
function dur(ms,long){ms=Math.max(0,ms);const m=Math.floor(ms/60000),h=Math.floor(m/60),d=Math.floor(h/24);
  if(m<1)return long?'Menos de 1 minuto':'ahora';
  if(h<1)return long?m+(m===1?' minuto':' minutos'):m+' min';
  if(d<1)return long?h+' h '+(m%60)+' min':h+' h';
  return long?d+(d===1?' día ':' días ')+(h%24)+' h':d+' d';}
function isoDay(ms){const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

function applyGifts(snap){
  const keep={};for(const p of GK.people)keep['g-'+p.id]=p;
  const out=[];
  for(const d of snap.docs){if(!d.id.startsWith('g-')||delPend.has(d.id))continue;
    if(busy[d.id]&&keep[d.id]){out.push(keep[d.id]);continue}
    const v=plain(d);if(typeof v.nombre!=='string')continue;
    out.push({id:v.id||d.id.slice(2),nombre:v.nombre,yo:!!v.yo,creada:+v.creada||0,regalos:Array.isArray(v.regalos)?v.regalos:[],t:v.t||0})}
  for(const k in busy)if(busy[k]&&k.startsWith('g-')&&keep[k]&&!out.includes(keep[k])&&!delPend.has(k))out.push(keep[k]);
  GK.people=out;ensureYo();
}

function giftHTML(p,g){

let AS=null;
function photoSrc(o){return o&&o.foto?'/_blob/'+o.foto:(o&&o.fotoData)||''}
function photoBlock(src,key){
  if(src)return `<div><img class="photo-big" src="${esc(src)}" alt="Foto" data-act="photoView" data-src="${esc(src)}">
    <div class="photo-acts"><label class="btn mini photo-btn">${ic('camera')} Cambiar foto<input type="file" accept="image/*" data-photo="${esc(key)}"></label><button type="button" class="btn danger mini" data-act="photoDel" data-photo="${esc(key)}">${ic('trash')} Quitar foto</button></div></div>`;
  return `<label class="photo-add">${ic('camera')} Añadir foto<input type="file" accept="image/*" data-photo="${esc(key)}"></label>`;
}
function openPhoto(src){$('#sheet').innerHTML=`<div class="grab"></div><div class="sh"><h2>Foto</h2><button type="button" class="round" data-act="close" aria-label="Cerrar">${ic('x')}</button></div><div class="viewer"><img src="${esc(src)}" alt="Foto"></div>`;SH={kind:'photo'};openSheet()}
function shrink(file,max,q){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res({blob:b,canvas:c}):rej(new Error('no blob')),'image/jpeg',q)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('No se puede leer esa imagen'))};img.src=url})}
function photoTarget(key){const [k,a,b]=key.split(':');
  if(k==='g'){const p=person(a),g=p&&p.regalos.find(x=>x.id===b);return g?{obj:g,save:()=>savePerson(p),redraw:renderRegalos}:null}
  if(k==='h'){return SH&&SH.kind==='medida'?{obj:SH.draft,save:()=>{},redraw:()=>drawMedida()}:null}
  return null}
async function photoPick(input){
  const file=input.files&&input.files[0],key=input.dataset.photo;input.value='';if(!file)return;
  const t=photoTarget(key);if(!t)return;
  if(key[0]==='h'&&!SH)return;
  toast('Preparando la foto…');
  try{
    if(AS){const {blob}=await shrink(file,1400,.82);const r=await AS.upload(blob,{type:'image/jpeg'});
      const old=t.obj.foto;t.obj.foto=r.id;delete t.obj.fotoData;if(old&&key[0]==='g')AS.delete(old).catch(()=>{});
      if(key[0]==='h'&&SH){if(old){if((SH.newPhotos||[]).includes(old))AS.delete(old).catch(()=>{});else SH.removed=(SH.removed||[]).concat(old)}SH.newPhotos=(SH.newPhotos||[]).concat(r.id)}}
    else{const {canvas}=await shrink(file,1200,.8);t.obj.fotoData=canvas.toDataURL('image/jpeg',.8);delete t.obj.foto}
    t.save();t.redraw();toast('Foto guardada');
  }catch(e){const c=e&&e.code;toast(c==='too_large'?'La foto es demasiado grande.':c==='quota_or_state'?'No queda espacio para más fotos.':'No se ha podido subir la foto'+(c?' ('+c+')':'')+'.')}
}
function photoRemove(key){const t=photoTarget(key);if(!t)return;const old=t.obj.foto;delete t.obj.foto;delete t.obj.fotoData;
  if(old&&AS&&key[0]==='g')AS.delete(old).catch(()=>{});
  if(old&&key[0]==='h'){SH.removed=(SH.removed||[]).concat(old)}
  t.save();t.redraw();toast('Foto quitada')}
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.photo)photoPick(e.target)});

const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function occIn(a,y){const m=+a.fecha.slice(5,7),d=+a.fecha.slice(8,10);const last=new Date(y,m,0).getDate();return y+'-'+pad(m)+'-'+pad(Math.min(d,last))}
function nextDate(a){const t=todayISO();if(a.fecha>=t)return a.fecha;const y=+t.slice(0,4);const o=occIn(a,y);return o>=t?o:occIn(a,y+1)}

function whenTxt(n){return n===0?'Hoy':n===1?'Mañana':n<0?'Hace '+(-n)+' días':n<45?'En '+n+' días':'En '+Math.round(n/30)+' meses'}
function chargesIn(ym){const y=+ym.slice(0,4);return S.anuales.filter(a=>a.fecha&&a.fecha.slice(0,4)<=String(y)&&occIn(a,y).slice(0,7)===ym).map(a=>({...a,_d:occIn(a,y)})).sort((a,b)=>a._d.localeCompare(b._d))}

    <span class="amt" style="font-weight:800">${eur(a.importe)}</span></button>`}
function viewAnuales(){
  const L=S.anuales.map(a=>({...a,_d:nextDate(a)})).sort((a,b)=>a._d.localeCompare(b._d)),tot=r2(L.reduce((s,a)=>s+(+a.importe||0),0));
  let h=`<section class="ann-sum"><div><div class="k">Total de gastos anuales</div><div class="big">${eur(tot)}</div></div>
    <div class="row3"><div><span>Al mes, de media</span><b>${eur(tot/12)}</b></div><div><span>Próximo cargo</span><b>${L.length?esc(L[0].concepto)+' · '+(+L[0]._d.slice(8))+' '+MES3[+L[0]._d.slice(5,7)-1]:'—'}</b></div></div></section>

  return h;
}

function boxSVG(al,an,fo){
  const A=+al||0,W=+an||0,F=+fo||0,mx=Math.max(A,W,F,1),s=v=>v>0?18+70*(v/mx):40;
  const w=s(W),hh=s(A),d=s(F)*.55,x0=40,y0=24+d;
  const P=(pts)=>pts.map(p=>p.join(',')).join(' ');
  return `<svg viewBox="0 0 ${x0+w+d+60} ${y0+hh+30}" aria-hidden="true">
    <polygon points="${P([[x0,y0],[x0+d,y0-d],[x0+d+w,y0-d],[x0+w,y0]])}" fill="var(--s3)" stroke="var(--muted)" stroke-width="1.2"/>
    <polygon points="${P([[x0+w,y0],[x0+w+d,y0-d],[x0+w+d,y0-d+hh],[x0+w,y0+hh]])}" fill="var(--s2)" stroke="var(--muted)" stroke-width="1.2"/>
    <rect x="${x0}" y="${y0}" width="${w}" height="${hh}" fill="var(--s1)" stroke="var(--fg)" stroke-width="1.4"/>
    <text x="${x0+w/2}" y="${y0+hh+18}" text-anchor="middle" fill="var(--fg)" font-size="12" font-weight="700" font-family="Manrope,sans-serif">${W?fmtCm(an)+' ancho':'ancho'}</text>
    <text x="${x0-6}" y="${y0+hh/2+4}" text-anchor="end" fill="var(--fg)" font-size="12" font-weight="700" font-family="Manrope,sans-serif">${A?fmtCm(al):'alto'}</text>
    <text x="${x0+w+d/2+6}" y="${y0-d/2-4}" fill="var(--muted)" font-size="11" font-weight="700" font-family="Manrope,sans-serif">${F?fmtCm(fo)+' fondo':'fondo'}</text></svg>`;
}

function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)})}

  </div>

    <p class="note" style="text-align:left;margin:0 0 10px">Sustituye lo que tienes ahora en ${S.mode==='db'?'tu cuenta':'este móvil'}.</p>
    <div style="display:flex;gap:8px"><button class="btn danger" style="flex:1" data-act="importOk">Sustituir mis datos</button><button class="btn" style="flex:1" data-act="importNo">Cancelar</button></div></div>`:''}
  <p class="err" id="shErr"></p>`;
  openSheet();

async function exportData(){
  if(!dl){toast('Las descargas no están disponibles aquí.');return}
  const data=JSON.parse(JSON.stringify({app:'mi-dia-a-dia',version:1,exportado:Date.now(),months:S.months,cats:S.cats,anuales:S.anuales,tareas:TK.list,regalos:GK.people.filter(p=>!p.yo||p.regalos.length),medidas:HK.items}));
  const withPhoto=[];for(const p of data.regalos)for(const g of p.regalos||[])if(g.foto)withPhoto.push(g);for(const it of data.medidas)if(it.foto)withPhoto.push(it);
  let fail=0;if(withPhoto.length)toast('Preparando '+withPhoto.length+' foto'+(withPhoto.length===1?'':'s')+'…');
  for(const o of withPhoto){try{const r=await fetch('/_blob/'+o.foto);if(!r.ok)throw 0;o.fotoData=await blobToDataURL(await r.blob());delete o.foto}catch(e){fail++;delete o.foto}}
  try{await dl.save({filename:'mi-dia-a-dia-copia-'+todayISO()+'.json',data:JSON.stringify(data)});toast(fail?`Copia guardada (${fail} foto${fail===1?'':'s'} no se pudo incluir)`:'Copia guardada')}
  catch(e){const c=e&&e.code;if(c!=='declined')toast('No se ha podido guardar la copia'+(c?' ('+c+')':'')+'.')}
}
function readImport(input){const f=input.files&&input.files[0];input.value='';if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.app!=='mi-dia-a-dia')throw 0;S.pendingImport=d;openBackup()}catch(e){toast('Ese archivo no es una copia de Mi día a día.')}};r.readAsText(f)}

  if(S.mode==='db'){for(const ym in S.months)saveMonth(ym);saveCats();saveAnuales();for(const t of TK.list)saveTask(t);for(const p of GK.people)if(!p.yo||p.regalos.length)savePerson(p);for(const it of HK.items)saveHouse(it)}

  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.tedit){e.preventDefault();e.target.blur();return}
  if(e.key==='Enter'&&SH&&e.target.matches('#shConcepto')){e.preventDefault();submitSheet();return}
  if(e.key==='Enter'&&SH&&SH.kind==='cat'&&e.target.matches('#catName')){e.preventDefault();submitCat();return}
  if(SH&&(SH.kind==='gasto'||SH.kind==='ingreso')&&!e.target.matches('input')){
    if(/^[0-9]$/.test(e.key)){pressKey(e.key);e.preventDefault()}
    else if(e.key===','||e.key==='.'){pressKey(',');e.preventDefault()}
    else if(e.key==='Backspace'){pressKey('back');e.preventDefault()}
    else if(e.key==='Enter'){submitSheet();e.preventDefault()}
  }
});

/* ---------- arranque ---------- */
async function init(){
  render();
  await kvInit();
  const C=window.claude;let user=null,db=null;
  if(!(C&&C.use)){
    dl={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith('.json')?'application/json':'application/octet-stream'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return{status:'saved'}}};
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  }
  if(C&&C.use){const u=n=>C.use(n).catch(()=>null);[user,db,dl,AS]=await Promise.all([u('user'),u('db'),u('downloads'),u('assets')])}
  let uidv=null;if(user){try{uidv=await user.id()}catch(e){}}
  if(db&&uidv){
    col=db.collection('data/users/'+uidv);S.mode='db';
    col.onSnapshot(snap=>{applySnap(snap);applyTasks(snap);applyGifts(snap);applyHouse(snap);S.ready=true;render()},
      err=>{toast('No se pueden cargar tus datos ('+((err&&err.code)||'error')+').');if(!S.ready){S.mode='local';loadLocal();loadTasksLocal();loadGiftsLocal();loadHouseLocal();S.ready=true;render()}});
  }else{S.mode='local';loadLocal();loadTasksLocal();loadGiftsLocal();loadHouseLocal();S.ready=true;render()}
}
window.addEventListener('error',e=>{try{toast('Algo ha fallado: '+(e.message||'error desconocido'))}catch(_){}});
init();
})();
</script>
